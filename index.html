<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klinikos asistentas • Demo</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#182a35;background:#f5f8fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e3ebef;padding:19px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1120px;margin:35px auto;padding:0 20px}.logo{font-weight:800;font-size:20px;color:#126e79}.muted{color:#697d87}.tag{font-size:12px;border-radius:20px;padding:7px 11px;background:#e8f6f5;color:#126e79}.layout{display:grid;grid-template-columns:210px 1fr;gap:25px}nav{display:flex;flex-direction:column;gap:7px}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#126e79;color:white;font-weight:600}nav button{text-align:left;background:transparent;color:#49616c}nav button.active{background:#e0f1f1;color:#126e79}.panel{background:#fff;border:1px solid #e1e9ec;border-radius:17px;padding:25px;box-shadow:0 8px 26px #193d4b08}h1{font-size:27px;margin:0 0 8px}h2{font-size:19px}label{display:block;margin:15px 0 6px;font-weight:600;font-size:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #cfdae0;border-radius:10px;background:white;font:inherit}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.out{white-space:pre-wrap;background:#f3f8f9;border:1px solid #dce9eb;padding:17px;border-radius:12px;min-height:120px;margin-top:18px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{background:#e8f2f3;color:#146b75}.hide{display:none}.note{padding:13px;background:#fff9e9;border-radius:10px;color:#795a16;margin:15px 0;font-size:13px}ul{line-height:2}@media(max-width:700px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.grid{grid-template-columns:1fr}}</style></head><body><header><span class="logo">✦ Klinikos asistentas</span><span class="tag">Nemokama demonstracija</span></header><main><h1>Administratoriaus darbo erdvė</h1><p class="muted">Atskiras pagalbininkas klinikai. Be jungties su Odonto.apsa CRM.</p><div class="layout"><nav id="nav"></nav><section class="panel"><div id="view"></div></section></div></main><script>
const sections=['Apžvalga','Atsakymai pacientams','Dokumentai','Užduotys','Gydymo pasiūlymai','Atsargos','Laukiančiųjų sąrašas','Atsiliepimai','Priminimai','Statistika'];
const store=(k,v)=>localStorage.setItem('klinika-demo-'+k,JSON.stringify(v)),load=k=>JSON.parse(localStorage.getItem('klinika-demo-'+k)||'[]');
let current=0;function render(){document.getElementById('nav').innerHTML=sections.map((s,i)=>'<button class="'+(i===current?'active':'')+'" onclick="current='+i+';render()">'+s+'</button>').join('');const v=document.getElementById('view');if(current===0){v.innerHTML='<h2>Darbo apžvalga</h2><p class="muted">Pasirinkite skiltį kairėje ir išbandykite funkcijas.</p><div class="note">Tik demonstracijai. Nenaudokite tikrų pacientų asmens ar sveikatos duomenų. Ši versija neturi serverio, prisijungimų ir tikro DI.</div><ul><li>Žinučių atsakymų juodraščiai</li><li>Dokumentų šablonai ir spausdinimas</li><li>Užduočių ir sąrašų apskaita naršyklėje</li></ul>';return}if(current===1){v.innerHTML='<h2>Atsakymų į žinutes rengimas</h2><p class="muted">Paruoškite redaguojamą juodraštį pagal savo nurodymus.</p><div class="note">Tai taisyklėmis pagrįstas juodraštis, ne DI. Tikram DI reikės saugios serverio integracijos.</div><label>Gauta žinutė (be asmens duomenų)</label><textarea id="incoming" placeholder="Įklijuokite anonimizuotą žinutę"></textarea><label>Ką norite atsakyti?</label><textarea id="intent" placeholder="Pvz., pasiūlyti susisiekti telefonu dėl laiko"></textarea><label>Tonas</label><select id="tone"><option>Profesionalus</option><option>Šiltas</option><option>Empatiškas</option><option>Trumpas</option><option>Tvirtas</option></select><div class="row"><button onclick="draft()">Paruošti juodraštį</button><button class="secondary" onclick="copyOutput()">Kopijuoti</button></div><textarea id="output" class="out" aria-label="Atsakymo juodraštis"></textarea>';return}if(current===2){v.innerHTML='<h2>Dokumentų šablonai</h2><div class="note">Šablonai yra pavyzdiniai, prieš naudojimą klinikoje juos turi patvirtinti atsakingi specialistai.</div><label>Dokumento tipas</label><select id="type"><option>Vizito patvirtinimas</option><option>Vizito atšaukimas</option><option>Vizito perkėlimo pranešimas</option><option>Pažymos juodraštis</option><option>Gydymo pasiūlymo lydraštis</option><option>Informavimo ir sutikimo juodraštis</option><option>Bendras oficialus laiškas</option></select><div class="grid"><div><label>Klinikos pavadinimas</label><input id="clinic" placeholder="Klinikos pavadinimas"></div><div><label>Data / laikas</label><input id="when" placeholder="Data ir laikas"></div></div><label>Papildoma informacija</label><textarea id="details" placeholder="Tekstas be jautrių asmens duomenų"></textarea><div class="row"><button onclick="documentDraft()">Sukurti dokumentą</button><button class="secondary" onclick="window.print()">Spausdinti / išsaugoti PDF</button></div><textarea id="output" class="out" aria-label="Dokumento tekstas"></textarea>';return}const key='list'+current;const names={3:['Užduotys','Užduoties aprašymas'],4:['Gydymo pasiūlymai','Pasiūlymo žyma (be paciento vardo)'],5:['Atsargos','Priemonė ir kiekis'],6:['Laukiančiųjų sąrašas','Anoniminė užklausos žyma'],7:['Atsiliepimai','Atsiliepimo prašymo užduotis'],8:['Priminimai','Priminimo užduotis'],9:['Statistika','Rodiklio pastaba']};let [title,placeholder]=names[current];v.innerHTML='<h2>'+title+'</h2><p class="muted">Bandomieji įrašai saugomi tik šioje naršyklėje.</p><label>Naujas įrašas</label><input id="item" placeholder="'+placeholder+'"><div class="row"><button onclick="addItem()">Pridėti</button><button class="secondary" onclick="exportItems()">Eksportuoti JSON</button></div><div id="items"></div>';drawItems()}
function draft(){const intent=document.getElementById('intent').value.trim();if(!intent){alert('Įrašykite, ką norite atsakyti.');return}const tone=document.getElementById('tone').value;const hello=tone==='Trumpas'?'Sveiki,':tone==='Šiltas'?'Sveiki, ačiū, kad parašėte!':tone==='Empatiškas'?'Sveiki, suprantame Jūsų situaciją ir dėkojame, kad kreipėtės.':'Laba diena,';document.getElementById('output').value=hello+'\n\n'+intent+'\n\n'+(tone==='Trumpas'?'Pagarbiai,':'Jei turite papildomų klausimų, kviečiame susisiekti.\n\nPagarbiai,')+'\nKlinikos administracija'}
function documentDraft(){let t=document.getElementById('type').value,c=document.getElementById('clinic').value||'[Klinikos pavadinimas]',w=document.getElementById('when').value||'[Data / laikas]',d=document.getElementById('details').value||'[Papildoma informacija]';document.getElementById('output').value=c+'\n'+t.toUpperCase()+'\n\nData / laikas: '+w+'\n\n'+d+'\n\nPagarbiai,\n'+c+'\n\n[Prieš naudojant patikrinti ir patvirtinti klinikoje.]'}
function copyOutput(){let e=document.getElementById('output');if(e)navigator.clipboard.writeText(e.value).catch(()=>{e.select();document.execCommand('copy')})}
function drawItems(){let a=load('list'+current);document.getElementById('items').innerHTML=a.length?a.map((s,i)=>'<div style="border-bottom:1px solid #e3eaed;padding:14px 0;display:flex;justify-content:space-between;gap:8px"><span>'+escapeHtml(s)+'</span><button class="secondary" onclick="removeItem('+i+')">Šalinti</button></div>').join(''):'<p class="muted">Įrašų dar nėra.</p>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addItem(){let x=document.getElementById('item').value.trim();if(!x)return;let a=load('list'+current);a.push(x);store('list'+current,a);document.getElementById('item').value='';drawItems()}
function removeItem(i){let a=load('list'+current);a.splice(i,1);store('list'+current,a);drawItems()}
function exportItems(){let a=load('list'+current),url=URL.createObjectURL(new Blob([JSON.stringify(a,null,2)],{type:'application/json'})),e=document.createElement('a');e.href=url;e.download='klinika-demo-'+current+'.json';e.click();URL.revokeObjectURL(url)}render();
</script></body></html>
